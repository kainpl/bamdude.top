name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys so a fast follow-up push doesn't race the previous run's
# rsync. cancel-in-progress aborts the older one — the newer build is what
# we want live.
concurrency:
  group: www-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + sync to nginx
    # Self-hosted runner ON the production server. The label-set narrows
    # this beyond "any self-hosted runner the org has" to specifically the
    # www-deploy runner — see deploy/README.md for the runner-install recipe.
    runs-on: [self-hosted, linux, www-deploy]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 6 requires Node >=22.12. Pin the major so the runner picks
          # up patch updates without surprise version bumps.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        env:
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}
          PUBLIC_SITE_URL: https://bamdude.top
          PUBLIC_GITHUB_REPO: https://github.com/kainpl/bamdude
        run: npm run build

      # Runner user owns DEPLOY_PATH (chown done in one-time server setup).
      # No SSH, no rsync-over-network — both source (./dist/) and
      # destination are on the same host, so this is a local copy.
      # --delete prunes files that no longer exist in the source build
      # (e.g. renamed pages / removed locales). Trailing slash on ./dist/
      # copies the *contents* into DEPLOY_PATH, not a nested dist/ dir.
      - name: Sync to web root
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_PATH" ]; then
            echo "DEPLOY_PATH secret is not set" >&2
            exit 1
          fi
          rsync -a --delete --human-readable --stats ./dist/ "${DEPLOY_PATH%/}/"

      # Relay (Fastify) ships alongside the static site under relay/ — see
      # relay/README.md for the full architecture + first-time server setup.
      # rsync into /opt/bamdude-relay, install prod deps, restart the systemd
      # unit. Skips cleanly if relay/package.json is missing (lets the deploy
      # workflow keep working on a checkout that hasn't pulled the relay
      # changes yet).
      - name: Sync + restart relay
        env:
          RELAY_PATH: /opt/bamdude-relay
        run: |
          if [ ! -f relay/package.json ]; then
            echo "No relay/package.json — skipping relay deploy."
            exit 0
          fi
          # First-time bootstrap: create the install dir if missing. The
          # runner user must own it — see relay/README.md.
          if [ ! -d "$RELAY_PATH" ]; then
            echo "$RELAY_PATH does not exist; ensure one-time setup is done." >&2
            exit 1
          fi
          # NOTE: --exclude screenshots — the screenshots dir lives inside
          # the install dir (operator state, not code). Without this exclude
          # rsync --delete would wipe every uploaded screenshot on every push.
          rsync -a --delete \
            --exclude node_modules \
            --exclude .env \
            --exclude screenshots \
            relay/ "$RELAY_PATH/"
          (cd "$RELAY_PATH" && npm ci --omit=dev)
          # The runner user gets a sudoers rule to restart bamdude-relay only;
          # see relay/README.md "One-time server setup" step 4. Three things to
          # match the rule precisely so sudo finds the NOPASSWD entry:
          #   - explicit -n (non-interactive — avoids tty prompt fallback)
          #   - explicit /usr/bin/systemctl path (matches sudoers rule path)
          #   - is-active without --quiet (sudoers requires exact arg match)
          sudo -n /usr/bin/systemctl restart bamdude-relay
          sleep 1
          sudo -n /usr/bin/systemctl is-active bamdude-relay > /dev/null
          # Probe the health endpoint before declaring success — fail loudly
          # if the relay didn't come back up after the rsync.
          curl -fsS http://127.0.0.1:3001/health > /dev/null

      # ``secrets`` context is forbidden in step ``if:`` expressions, so we
      # check at shell level instead. Step always runs but no-ops cleanly
      # when the optional Cloudflare secrets aren't set.
      - name: Purge Cloudflare cache
        env:
          ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$ZONE" ] || [ -z "$TOKEN" ]; then
            echo "Cloudflare secrets not set — skipping cache purge."
            exit 0
          fi
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/purge_cache" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | head -c 200
          echo
