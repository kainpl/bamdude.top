server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bamdude.top;

    root /var/www/bamdude.top;
    index index.html;

    # TLS terminates here — Cloudflare's "Full (Strict)" mode requires a
    # valid cert. Use the Cloudflare Origin CA cert (free, 15-year), or
    # Let's Encrypt with HTTP-01.
    ssl_certificate     /etc/ssl/cloudflare-origin/bamdude.top.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin/bamdude.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # bamdude-telemetry API (NestJS on 127.0.0.1:3001 — separate
    # kainpl/bamdude-telemetry repo; see its deploy/ for the full config).
    # It serves telemetry ingest, the bug-report relay (holds the GitHub PAT,
    # POSTed to from the in-app BugReportBubble), and the admin API. Public
    # paths are unchanged from the old standalone relay so deployed BamDude
    # installs keep working. Body limit aligned with MAX_BODY_BYTES (12 MB).
    location /api/bug-report {
        client_max_body_size 13m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Telemetry ingest (server-to-server). The api derives a coarse country
    # from CF-IPCountry and never stores the IP.
    location /api/telemetry {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }

    # Admin auth + admin API (JWT-guarded, Google OAuth callback).
    location /api/auth {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/admin {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health probe (no auth, no PII).
    location = /api/health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Screenshots uploaded with bug reports — the api writes them here, nginx
    # serves them as static files (URLs land in the GitHub issue body). The
    # dir only ever holds UUID-named .jpg files the api wrote; `alias` +
    # `try_files =404` is sufficient against traversal.
    location /bug-attachments/ {
        alias /var/lib/bamdude-telemetry/screenshots/;
        add_header Cache-Control "public, max-age=86400, immutable";
        try_files $uri =404;
    }

    # Admin dashboard SPA. Lock it behind Cloudflare Access / basic-auth.
    location /admin {
        alias /var/www/bamdude-telemetry-admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Astro is configured with trailingSlash: 'never'. The fallback chain
    # below handles all four shapes the user might type:
    #   /uk        -> dist/uk/index.html
    #   /uk/       -> dist/uk/index.html
    #   /favicon.ico -> dist/favicon.ico
    #   anything else -> 404
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Hashed Astro assets — content-addressed names mean a "stale" copy
    # is impossible. Cache for a year.
    location ~* ^/_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Build-time-generated Open Graph images — rare changes, week cache.
    location ~* ^/og/.*\.png$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # HTML — short TTL so a typo fix is live within minutes even when CF
    # doesn't get a purge call. The deploy workflow purges CF anyway when
    # the optional CF secrets are set.
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # robots / sitemap — direct lookups, no fallback rewriting
    location = /robots.txt        { try_files /robots.txt =404; }
    location = /sitemap-index.xml { try_files /sitemap-index.xml =404; }

    # Origin gzip — Cloudflare brotlis at the edge, but origin gzip cuts
    # internal bandwidth between CF and the server when CF re-fetches.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml application/xml+rss;
    gzip_min_length 1024;
}

# www → apex, in case a request bypasses Cloudflare's redirect rules.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bamdude.top;

    ssl_certificate     /etc/ssl/cloudflare-origin/bamdude.top.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin/bamdude.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://bamdude.top$request_uri;
}

# Plain :80 → 301 to https. Cloudflare also handles this, but the redirect
# at origin keeps things sane if a request ever bypasses the proxy.
server {
    listen 80;
    listen [::]:80;
    server_name bamdude.top www.bamdude.top;
    return 301 https://$host$request_uri;
}
